# GitHub Actions pipeline for this repository — NOT ACTIVE WHERE IT SITS.
#
# This file belongs at .github/workflows/ci.yml. It lives here because the GitHub App that pushes
# this branch has no `workflows` permission: a push creating or updating anything under
# .github/workflows/ is rejected outright (verified again on 2026-08-29 — the move was made, the
# push was refused, the file was parked back). Rather than lose the pipeline, it is parked verbatim.
#
# To turn it on:  git mv ci/github-actions.yml .github/workflows/ci.yml && git commit && git push
# Or grant the Claude GitHub App the `workflows` scope and move it back in one commit.
# Activating it is a two-file change: tests/docs.test.ts pins the parked state and HARNESS.md
# describes the gates as manual, so both flip in the same commit or `pnpm test` goes red.
#
# Every gate below was run locally on 2026-08-29 against this branch and passed: pnpm typecheck,
# pnpm test (610), pnpm build, and pnpm matrix -- --seeds 1-100 (kite 70%, naive 0%, both in band).
#
# pnpm/action-setup reads its pnpm version from package.json's `packageManager` field, which this
# repo pins; without one the action fails at setup, so keep that field when bumping pnpm.
#
# The art pipeline reaches CI through `pnpm test`: the gates run over every shipped sheet, and
# tests/art/reproducibility.test.ts recompiles each spec into a temp directory and hashes it
# against what is committed, so a hand-edited asset or a stale sidecar fails the build.
#
name: ci

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The simulation is deterministic and headless, so almost everything worth proving is provable
  # without a browser. This job is the fast gate: if it is red, nothing else matters.
  sim:
    name: sim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: tests (includes pinned replay hashes)
        run: pnpm test
      - name: production build
        run: pnpm build
      # Structural gate: no seed may strand a player mid-run. Also reports the win-rate band, which
      # is how a balance regression announces itself before a human ever notices.
      - name: seeded acceptance matrix
        run: pnpm matrix -- --seeds 1-100

  # What the sim suite cannot see: the page booting, the atlas and fonts loading, the presenter
  # surviving six room rebuilds, and a run reaching its summary without throwing.
  browser:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: install chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: build
        run: pnpm build
      - name: serve
        run: pnpm preview &
      - name: wait for server
        run: npx --yes wait-on http://localhost:5173 --timeout 60000
      # Drives both endings — a won run and a lost one — through the real renderer.
      - name: golden-path smoke
        run: pnpm smoke -- --url http://localhost:5173
