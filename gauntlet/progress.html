<title>Gauntlet Progress</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #F2F4F6; --surface: #FFFFFF; --line: #D9DEE4;
    --ink: #14181D; --muted: #5C6773; --accent: #1F5FBF;
    --win: #1E7F4F; --gap: #B7791F; --bad: #B03A2E; --pending: #6B7480;
    --win-bg: #E3F3EA; --gap-bg: #FBF0DA; --bad-bg: #F8E2DF; --pending-bg: #E9ECEF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0F1216; --surface: #171B21; --line: #2A313A;
      --ink: #E8ECF0; --muted: #8B96A3; --accent: #6FA3FF;
      --win: #5CCB8B; --gap: #E2B45B; --bad: #EE8A7C; --pending: #98A2AE;
      --win-bg: #15301F; --gap-bg: #3A2D12; --bad-bg: #3B1B17; --pending-bg: #222831;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0F1216; --surface: #171B21; --line: #2A313A;
    --ink: #E8ECF0; --muted: #8B96A3; --accent: #6FA3FF;
    --win: #5CCB8B; --gap: #E2B45B; --bad: #EE8A7C; --pending: #98A2AE;
    --win-bg: #15301F; --gap-bg: #3A2D12; --bad-bg: #3B1B17; --pending-bg: #222831;
  }
  body { background: var(--ground); color: var(--ink); font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif; margin: 0; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 20px; }
  h1, h2, h3 { font-family: "Archivo", "IBM Plex Sans", sans-serif; margin: 0; text-wrap: balance; }
  h1 { font-size: 22px; font-weight: 700; line-height: 1.2; }
  h2 { font-size: 15px; font-weight: 700; }
  h3 { font-size: 15px; font-weight: 700; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  header { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .bar { color: var(--muted); }
  .bar b { color: var(--ink); font-weight: 600; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--muted); }
  .stats span b { color: var(--ink); font-weight: 500; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 720px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .pill { font-size: 11px; font-weight: 600; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .pill.WIN { color: var(--win); background: var(--win-bg); }
  .pill.OPEN, .pill.GAP { color: var(--gap); background: var(--gap-bg); }
  .pill.PARKED, .pill.BUDGET, .pill.STALL { color: var(--bad); background: var(--bad-bg); }
  .pill.DRY, .pill.PENDING, .pill.ERROR { color: var(--pending); background: var(--pending-bg); }
  .rounds { display: flex; gap: 4px; flex-wrap: wrap; }
  .rounds i { width: 14px; height: 14px; border-radius: 3px; background: var(--pending-bg); display: inline-block; }
  .rounds i.WIN { background: var(--win); } .rounds i.GAP { background: var(--gap); } .rounds i.STALL, .rounds i.ERROR { background: var(--bad); }
  .exhibits { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .exhibit { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .exhibit img { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 4px; background: var(--ground); }
  .exhibit pre { margin: 0; font-size: 12px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 4px; padding: 8px; background: var(--ground); }
  .exhibit .none { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; padding: 12px; text-align: center; }
  .gapbox { font-size: 14px; }
  .gapbox b { font-weight: 600; }
  .gapbox .fix { color: var(--muted); }
  details { font-size: 13px; }
  summary { cursor: pointer; color: var(--accent); font-weight: 500; }
  details ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .log { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .log table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .log th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); }
  .log td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .log tr:last-child td { border-bottom: 0; }
  .tablewrap { overflow-x: auto; }
  .empty { color: var(--muted); font-size: 14px; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

window.GAUNTLET_STATE = {"goal":"Finish Bardo Rogue, a browser action-roguelike, so a blind critic cannot pick it out beside real Enter the Gungeon and Hades frames.","bar":"Enter the Gungeon and Hades","arena":"game","mix":"efficient","stopRule":"until the user stops it","wave":3,"status":"running","evidenceLimit":"Reference exhibits are 1920x1080 gameplay stills. Motion timing is judged against the rubric's feel-chain acceptance criteria using our own tick-labelled strips, not against the bar. Every motion verdict must say so.","phase0":"Repair batch run before wave 1: attack edge-trigger, camera-aware pointer, live metrics getter, widened state hash, visual/gameplay RNG stream split, pool-overflow telemetry, restart replay parity, tools/strip.ts motion exporter, ART_DIRECTION.md, per-entity views split, recalibrated balance gates.","lanes":[{"id":"feel","why":"sword, dodge and impact all read and write player.ts, combat.ts, tuning.ts, presenter.ts and camera.ts. One owner, in sequence.","pieces":["sword-swing","hit-impact","dodge-roll"]},{"id":"brute","why":"own sim file plus its own view module after the views split; disjoint from every other lane.","pieces":["brute"]},{"id":"caster","why":"own sim file plus its own view module; disjoint.","pieces":["caster"]},{"id":"charger","why":"own sim file plus its own view module; disjoint.","pieces":["charger"]},{"id":"ui","why":"hud.ts and damageNumbers.ts are touched by nothing else this wave; two pieces share hud.ts so they run in sequence.","pieces":["combat-hud","death-card"]},{"id":"audio","why":"src/audio is fully disjoint from every other lane.","pieces":["audio-bed"]}],"pieces":{"sword-swing":{"spec":"The three-hit greatsword chain: anticipation, arc, contact, recovery, and a heavy third hit that reads as a commitment. Verified leads, do not spend a round rediscovering them: the heavy is only +4 startup ticks, +2 hit-stop, +60 degrees of arc and double damage — nothing in the world commits to it, so it reads as a big light hit rather than a greatsword. Movement is zeroed for 10 ticks during heavy startup (167 ms) and is barely perceived. The crescent arc with tapered trailing edge is already the best visual in the game; build on it, do not replace it. Consider hit-confirm recovery (connecting cancels earlier than missing), whiff commitment, aim steering during early startup only, and an authored lunge curve instead of the current uniform one. Responsive does not mean uncommitted: do not make all four phases equally cancellable.","owns":["src/sim/player.ts","src/sim/combat.ts","src/tuning.ts","src/render/views/player.ts","src/render/presenter.ts","src/render/particles.ts","src/render/camera.ts"],"protocol":"Motion. Dev server must already be on :5173; never start a second. 1) `pnpm strip -- --scenario dummy --seed 1 --from the first attack press --frames 12 --every 2 --crop 176,88,128,96 --out <E>/strip.png` — tick-labelled, --stepwise discipline, NEAREST upscale only. 2) the sidecar `<E>/strip.png.json` state+event trace. 3) `pnpm poses -- --only swing --out <E>/poses.png`. 4) the single most load-bearing frame, 4x NEAREST crop, as `<E>/exhibit.png` — this is the blind-comparison exhibit and it must be the same medium as the reference. 5) startup/active/recovery tick counts read from the trace, written to `<E>/timing.json`. Same seed, same crop box, every round. DRIVE THE INPUT WITH DISCRETE PRESSES, never `--hold '{\"attack\":true}'`: the hold flag re-applies the input partial before every single step, which is mashing at 60 Hz and hides what a player's own timing produces. Attack is now a true edge (one press = one intention), so use the `--eval` hook to press once per swing at the earliest legal chain tick. A chain captured by per-tick re-pressing is a fiction.","reference":["gauntlet/evidence/reference/ref-melee-01.jpg","gauntlet/evidence/reference/ref-melee-02.jpg","gauntlet/evidence/reference/ref-melee-03.jpg"],"status":"parked","rounds":2,"stalls":2,"memo":[{"wave": a8/P3m+p/nSN0/CvaaPz72MXq0dFbeM/EFjBHbWt0UijTywoJXKf3WwRuHscisDU9Tn1a6N3eYMhAHyjAAHQAVSao2604pLU8ucEnof/9k="}},"hit-impact":{"spec":"The moment a hit lands: freeze, flash, knockback, reaction, camera, sound. Verified leads: the camera is SILENT on light hits, which are ~90 percent of all swings. Shake is trauma squared times shakeMax, so traumaLight 0.22 yields 0.22^2 x 4px = 0.19 internal pixels — invisible at 480x270 — and the directional kick is gated on `ev.heavy || ev.killed` (presenter.ts:80) so light hits get none at all. Separately, TWO reward channels are dead code: `dodged` (a successful i-frame dodge-through, the most skill-expressive input in the game) and `enemyStagger` are both emitted by the sim and consumed ONLY by metrics — grep confirms zero presenter and zero audio consumers. The game says nothing when the player does the hardest thing in it. The kill shatter, blood decals that outlive the fight, and the poise rule (only the heavy staggers a brute) already work; keep them.","owns":["src/sim/combat.ts","src/tuning.ts","src/render/presenter.ts","src/render/particles.ts","src/render/camera.ts","src/render/views/player.ts"],"protocol":"Motion. Dev server must already be on :5173; never start a second. 1) `pnpm strip -- --scenario wave1 --seed 1 --from 2 ticks before first contact --frames 12 --every 2 --crop 160,80,160,110 --out <E>/strip.png` — tick-labelled, --stepwise discipline, NEAREST upscale only. 2) the sidecar `<E>/strip.png.json` state+event trace. 3) `pnpm poses -- --only kill --out <E>/poses.png`. 4) the single most load-bearing frame, 4x NEAREST crop, as `<E>/exhibit.png` — this is the blind-comparison exhibit and it must be the same medium as the reference. 5) startup/active/recovery tick counts read from the trace, written to `<E>/timing.json`. Same seed, same crop box, every round. Additionally capture an idle strip with the SAME crop as `<E>/strip-idle.png`: a light-hit strip that is indistinguishable from idle is an automatic loss. D seed, same crop box, every round. DRIVE THE INPUT WITH DISCRETE PRESSES, never `--hold '{\"attack\":true}'`: the hold flag re-applies the input partial before every single step, which is mashing at 60 Hz and hides what a player's own timing produces. Attack is now a true edge (one press = one intention), so use the `--eval` hook to press once per swing at the earliest legal chain tick. A chain captured by per-tick re-pressing is a fiction.","reference":["gauntlet/evidence/reference/ref-melee-01.jpg","gauntlet/evidence/reference/ref-melee-02.jpg","gauntlet/evidence/reference/ref-melee-03.jpg"],"status":"parked","rounds":6,"stalls":2,"memo":[{"wave":2,"round":2,"element":"contact flash at overlap","stronger_does":"keeps an opaque body occupying a standing beam, no hurt color","fix":"Changed the threat to a bolt column. Stall 1. Do not grind another brute-slam through."},{"wave":2,"round":3,"element":"beam-occupied silhouette","stronger_does":"holds a flat dive inside the column so the glow eats the body","fix":"Split with wow both ways. Held dive through occupy; kept the cyan floor ring."},{"wave":2,"round":4,"element":"column-occupied silhouette","stronger_does":"a tumbling painted body the beam bloom swallows, head then torso then legs, plus plant dust","fix":"PARK. Two looks at occupancy after the slam-as-hit exhibit was retired. Re-enter behind authored roll-through frames. Dive-through-occupy, one-shot dodged announce, and no screen pulse stay."},{"wave":2,"round":4,"element":"The successful-dodge burst in strip-through.png, roll ticks 1-2 (t=48, t=49). Measured on the native 128x96 crop: a filled ~40x28 px starburst with an opaque near-white core (L=240) sits exactly on the player. At t=48 and t=49 neither the player nor the brute has a single visible pixel of silhouette — the two frames are also near-identical (frac>90% luminance 0.041 then 0.042), so it is one still image held for 2 ticks with no actor in it. It also lifts the WHOLE frame: native median luminance goes 36 -> 53 (+47%) at t=48 and is still 39 at t=49. Add the tick before it (t=47, the press) where the brute's attack telegraph is an opaque orange ellipse painted OVER both bodies, and three consecutive ticks (50 ms) at the decisive moment of the game's core defensive move contain no readable character.","stronger_does":"In ref-melee-01 the white slash is a hollow crescent: the bright pixels form a thin directional arc with an empty interior, drawn UNDER the actors. Zagreus's fully-shaded sprite and Megaera's whole body stay 100% readable through the brightest VFX in the frame, and the screen's median luminance never lifts — the burst is local and the room stays dark around it. The brightest pixels point at the target instead of covering it. Same in ref-melee-03: a huge fire bloom, and Zagreus is still drawn on top of it, silhouette intact.","fix":"Draw the dodge reward behind the actors and never over them: replace the filled disk with an open ring/crescent (1-2 px stroke) plus a directional smear along the roll axis, and re-composite the player and the enemy sprites on top with a 1 px white rim so the brightest pixel in the frame lands ON the actor. Cap the core at ONE tick of full brightness and decay it over 2-3 ticks instead of holding an identical frame twice. Delete the frame-wide additive lift entirely (target: median luminance moves less than 5, not 17). Same treatment for the brute's telegraph — make it a floor decal drawn under both bodies, not an opaque fill on top of them.","repro":null}],"latest":[],"history":[],"latestExhibit":null,"referenceExhibit":{"image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAYQBhAAD/4QCARXhpZgAATU0AKgAAAAgABAEaAAUAAAABAAAAPgEbAAUAAAABAAAARgEoAAMAAAABAAIAAIdpAAQAAAABAAAATgAAAAAAEYdtAAAufgARh20AAC5+AAOgAQADAAAAAQABAACgAgAEAAAAAQAAAoCgAwAEAAAAAQAAAWgAAAAA/+0AOFBob3Rvc2hvcCAzLjAAOEJJTQQEAAAAAAAAOEJJTQQlAAAAAAAQ1B2M2Y8AsgTpgAmY7PhCfv/AABEIAWgCgAMBIgACEQEDEQH/xAAfAAABBQEBAQEBAQAAAAAAAAAAAQIDBAUGBwgJCgv/xAC1EAACAQMDAgQDBQUE he actors. Measured on the 128x80 game frame: 809 game px above L 0.55, 604 above L 0.70, and ZERO pixels above L 0.85. Brightest pixel in the whole frame is RGB 236,204,203 (L=0.826) — nothing reaches white. The blob erases the brute down to the crown row and swallows the player entirely; at the one moment the player must read who hit whom and which way they are being thrown, the frame contains no silhouette, no outline, no direction vector.","stronger_does":"All three reference frames build the same event as a value pyramid with a hard apex and an intact silhouette. Measured identically: ref-01 0.28% of frame at L>0.95 / 0.79% >0.85 / 1.53% >0.70; ref-02 1.50 / 2.98 / 4.29; ref-03 0.69 / 2.37 / 5.90. Every one touches 255,255,255, and 7-18% of the bright mass sits in the top apex band. The core is tiny (ref-01's is roughly 12x14 game px), and it is layered — white core, yellow ring, saturated orange, red rim, grey smoke plumes on independent arcs — sitting ON TOP of the boss while the boss's face, eyes, mouth and dark outline stay fully legible underneath. The flash adds light; it never subtracts the character.","fix":"Invert the area/intensity trade: shrink the flash footprint by roughly 4-6x (target under 150 game px above L 0.55) and give it a real apex — a 6-10 game px core clamped to the palette's authored white so the frame finally has pixels above L 0.95, then two banded falloff steps (hot core, mid, rim) rather than one fill. Draw it additively over the actors and re-stamp the brute's and player's outline pixels on top afterwards so neither silhouette can ever be erased, and offset the whole thing along the attack angle (1.5708, straight south) instead of centring it, so contact carries direction.","repro":null}],"latest":[],"history":[],"latestExhibit":null,"referenceExhibit":{"image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAACgKADAAQAAAABAAABaAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAA appens 0-3 times per full run. The whole aim state is punishable, which is good. Verified bug in your file: caster.ts calls `world.fireProjectile(...)` and then emits `boltFired` UNCONDITIONALLY, so a saturated caster claims a shot and enters recovery with no projectile (a harness agent is fixing that specific line right now — rebase on it, do not duplicate it). NOTE: `src/tuning.ts` and `src/render/presenter.ts` belong to the feel lane this wave; stop and report if you need them. SHARED FILES, not yours: `src/render/views/shared.ts` (EntityView and the common helpers) and `src/render/views/enemies.ts` (the per-kind dispatcher) are owned by no lane this wave. If your fix needs either, stop and report rather than editing them — a second lane is very likely reading the same lines. One coupling to know about: `BoltView` and `drawAimLine` live in your file but `BoltView` renders EVERY projectile, not just caster bolts. Changing it changes what other enemies' projectiles look like. Keep bolt visuals caster-specific unless the change is genuinely universal, and say which you did.","owns":["src/sim/enemies/caster.ts","src/render/views/enemy-caster.ts"],"protocol":"Motion. Dev server must already be on :5173; never start a second. 1) `pnpm strip -- --scenario caster --seed 1 --from aim start --frames 12 --every 2 --crop 144,72,192,128 --out <E>/strip.png` — tick-labelled, --stepwise discipline, NEAREST upscale only. 2) the sidecar `<E>/strip.png.json` state+event trace. 3) `pnpm poses -- --only caster --out <E>/poses.png`. 4) the single most load-bearing frame, 4x NEAREST crop, as `<E>/exhibit.png` — this is the blind-comparison exhibit and it must be the same medium as the reference. 5) startup/active/recovery tick counts read from the trace, written to `<E>/timing.json`. Same seed, same crop box, every round. Include a bolt-cut in the captured range; the trace must show the cut event.","reference":["gauntlet/evidence/reference/ref-density-01.jpg","gauntlet/evidence/reference/ref-density-02.jpg","gauntlet/evidence/reference/ref-density-03.jpg"],"status":"parked","rounds":6,"stalls":2,"memo":[{"wave":2,"round":1,"element":"body on the lock line","stronger_does":"runs the beam through the figure you have to move","fix":"Won the pick both orders, missed wow. Fair bar is a Sniper Shell lock, not a density room."},{"wave":2,"round":4,"element":"death line from an aimed weapon","stronger_does":"a scoped muzzle throws a fat red laser that owns the floor","fix":"PARK. Occupied sight vs authored rifle. Thick beam reads as a hit; thin beam reads as overlay. Re-enter behind a painted staff and sight. Solid lock, stop-on-body, COL_SIGHT, staff scale, and the detached bolt stay."},{"wave":2,"round":4,"element":"The caster's bolt at ticks 74-80 (strip.png cells #08-#10, exhibit.png). Measured at native scale off strip.png: the bolt renders as a wedge that is THICKEST at the caster and tapers outward - column pixel-heights at t=74 run 16,18,15,16,15,13,13,11,11,11,10,10,9,8,7,7,7 from x=70 to x=84. It never detaches: scanning right from the caster's 16px sprite box (crop x 53-69), the first empty column is x=85 at t=74, x=82 at t=77, x=93 at t=80 - a continuous bridge of effect pixels from the shooter's body to the bolt front in every single frame. And it does not travel: the mass strictly right of the caster has centroid x = 76.0 / 74.7 / 76.2 at t=74/77/80, net +0.2 px over six ticks, while the trace moves the bolt 11 px (world 172 -> 184.8 by t=81). Its area is flat too: 205 / 218 / 206 magenta px - no decay over 9+ ticks. At t=74 the discharge also completely covers the caster: you cannot see who fired. So the threat has no head, no gap, no travel and no decay. It reads as a beam the caster is holding, not an object crossing the room - which also means there is no single readable contact frame for the shot, just a 9-tick plateau.","stronger_does":"In ref-density-02 downsampled to native 480x270, every enemy bullet is a compact ~7px round white head with a hard 1px rim, sitting at a clearly separated point on a thin 1-2px trail; consecutive heads sit ~11px apart, so displacement is unmissable frame to frame. In ref-density-01 the rocket is a ~5x8 head with a 1-2px white smoke trail, and the blue orb is a 5px round - nothing is welded to its shooter, and the shooter stays fully readable. The reference rule is consistent: the HEAD is the brightest, most compact, most detached element and the trail is thinner and dimmer behind it. Our wedge inverts that - brightest and fattest at the origin, tapering toward the target.","fix":"Split the one effect into three. (a) Muzzle flash: its own burst at the caster's hand that decays to zero over 2-3 ticks and is clipped so it never covers the caster's 16px silhouette. (b) Bolt head: a compact shape no wider than ~6 native px, the brightest thing in the effect. (c) Trail: capped in length and at most 1/3 the head's luminance, with the hard requirement that an empty column opens between the caster sprite box and the bolt within 3 ticks of firing - re-run the column scan above as the gate. Then make motion visible: at 110 px/s the head advances 1.83 px/tick, less than one 2x-scaled pixel, and the 34px trail is 19x that displacement, so the travel is buried. Either raise bolt speed until the head centroid advances >=3 px/tick, or increase the caster's stand-off so the flight is long enough to read, and verify by re-measuring the head centroid per tick - the pass condition is monotonic, not the +0.2 px it measures now.","repro":null}],"latest":[],"history":[],"latestExhibit":null,"referenceExhibit":{"image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAACgKADAAQAAAABAAABaAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+IH6ElDQ19QUk9GSUxFAAEBAAAH2GFwcGwCIAAAbW50clJHQiBYWVogB9kAAgAZAAsAGgALYWNzcEFQUEwAAAAAYXBwbAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y1hcHBsAAAAAAAAAAAAAAAAAAAAA itstop FREEZE 4. Our ONLY impact language is a full-viewport red overlay. Measured against the neighbouring frames: 96.3% of pixels change between t=308 and t=310; the untouched wall two-thirds of the screen away from the hit goes (62,73,91) blue-grey to (121,83,97) pink; the black floor lifts from luminance 8 to 15; peak luminance FALLS from 240 to 211; pixels above luminance 230 go from 0.529% at t=308 to 0.000% at t=310. The frame in which the player takes damage is the only frame in the entire 22-tick sentence with nothing at all in the top luminance band. At the contact point itself there is no spark, no debris, no directional streak — the player sprite at t=310 is pixel-identical to t=308 apart from the global tint. The impact is rendered by subtracting contrast from the whole room.","stronger_does":"In ref-density-01 the impact is the brightest thing in the room and the room keeps its own colour. The explosion is a local additive core at pure 255 white with a spark fan and a rotating debris plume: 23,407 pixels at >=254 in a single frame, 0.500% of the frame above luminance 230 — and that frame is DARKER overall than ours (mean luminance 29.6 vs our 44.6). The dark blue floor tiles four tiles away from the blast are unchanged. Impact adds light locally; it never desaturates the room globally. ref-density-02 does the same at higher intensity: 174,944 pixels at >=254, 2.53% above 230, and the brick floor under the lasers keeps its red.","fix":"Two moves. (1) Give impact somewhere to go: no pixel in ANY of our rendered frames exceeds (236,240,246) — exhibit.png, exhibit-crowd.png and every strip panel share that exact ceiling, and the charger lane's own white rim already sits on it. Raise the ceiling to a true 255 white reserved for hit sparks and muzzle-class events only, so a hit can out-shine the telegraph that preceded it. (2) Replace the full-frame multiply with a local additive burst on the damage tick: a 3-5 px 255-white core at the contact point, 4-8 rad opening onto star-sky, THE THRESHOLD. Also add the run summary that is missing. `ART_DIRECTION.md` at the repo root is the aim; cite it.","owns":["src/render/hud.ts","src/render/atmosphere.ts"],"protocol":"Still plus short motion. `pnpm strip -- --scenario wave1 --seed 5 --from <the killing blow> --frames 10 --every 3 --out <E>/strip.png` for the death sequence, plus the settled card as `<E>/exhibit.png` at 2x NEAREST. Same seed and start tick every round.","reference":["gauntlet/evidence/reference/ref-death-01.jpg"],"status":"parked","rounds":5,"stalls":2,"memo":[{"wave":2,"round":0,"element":"bar locked","stronger_does":"a run-end death page (taped kill still + named killer), not a hub room or a combat HUD","fix":"Judge the settled card against ref-death-01. Fight chrome leaves when the stele owns the frame."},{"wave":2,"round":3,"element":"authored fallen pose","stronger_does":"a body that has fallen and a stele that is carved stone, not a Graphics plaque over a standing heap","fix":"PARK. Two no-wow wins after a split. Material/composition/pixel stuck at 3. Re-enter behind authored death art. Fight chrome off, left stele, TAKEN BY, wine well, star-sky arch stay."},{"wave":2,"round":3,"element":"The death card's plate itself — the panel rect at native (128,42)-(351,231), 224x190. Measured off exhibit.png downsampled to native 480x270: the panel fill has a median luminance of 13/255; the scrimmed world just outside it has a median of 7.7/255. The card is separated from the room by 5 luminance units — 2.1% of the range — plus a single 1px hairline (top edge 114, bottom edge 86). There is no cast shadow: the 7 rows below the bottom border read 7.7, 9.0, 10.3, 11.8, 10.0, 7.7, 7.7 (that is room content, not a shadow) and the 7 columns left of the left border read a flat 7.72 all the way out. And the fill is translucent, not a plate: at normal exposure the room's shelf edges and a wall crack read straight through the card, crossing under the gold divider and behind the SENT ONWARD row. Whole-frame tone: p50=8, p90=18, p99=130, max=225, and only 0.12% of pixels above 72% luminance.","stronger_does":"ref-ui-02 is the quietest, darkest frame in the reference pair — a solemn hall, no combat — and it still measures p50=25, p90=87, p99=225, with 2.00% of pixels above 72% luminance. Ours is 3x darker at the median, 5x darker at p90, and carries 1/17th the count of lit pixels; our single brightest pixel in the entire frame (225) only just reaches the reference's p99. Every framed object in both references — the boon doorway, the Mask of Nyx panel, the shrine plinths — is an opaque painted surface stacked in at least three layers: a dark cast shadow separating it from the ground, a heavy mid-value metal frame, and an inner bevel with a lit top edge and a dark bottom edge. The object reads as a physical thing sitting in front of the room, and it owns the top of the frame's value range. Ours reads as a hairline drawn on the room.","fix":"Make the card an object, not an overlay. 1) Kill the translucency — fill opaque so no room geometry crosses the card; nothing behind it should be recoverable at any exposure. 2) Lift the plate off the scrim: fill median from 13 to roughly 34-45 while pushing the scrim's side-region median from 7.7 down to ~4, so figure/ground is carried by value (a 30+ unit step) and not by a 1px line. 3) Layer the frame instead of one hairline: a 2px dark ring at luminance ~3 offset 2px down-right as a cast shadow, then the 1-2px gold rail, then a 1px inner bevel — highlight ~150 on the top and left, ~70 on the bottom and right (the existing 114-top/86-bottom split is the right instinct, it just has nothing stacked on either side of it). 4) Give the plate a material: a low-amplitude texture or a top-to-bottom ramp inside the fill so the surface is not one flat swatch. Target: frame p90 clears 60 and 1%+ of pixels above 72% luminance, with the card — not the room's leftover torches — supplying it.","repro":null}],"latest":  that clips is a loss, (4) the event timeline from a replay. Judge structure and levels, not taste.","reference":["gauntlet/evidence/reference/ref-density-01.jpg","gauntlet/evidence/reference/ref-density-02.jpg","gauntlet/evidence/reference/ref-density-03.jpg"],"status":"parked","rounds":5,"stalls":2,"memo":[{"wave":2,"round":2,"element":"player-commit lift","stronger_does":"keeps swing and dodge clearly above the combat bed under full voice load","fix":"PARK. Two losses on the same family. Gain, delayed commit duck, and an SFX crowd carve did not hold ~6 dB broadband on swing and dodge in both renders. Re-enter behind authored combat stems and recorded swing takes. Buses, bed, announcer-off, crowd, lead stay."},{"wave":2,"round":2,"element":"The danger channel has one timbre. Per event-sound-map.png, six of the game's danger cues — enemyWindup brute (3000 Hz), caster (2100 Hz), charger (2200 Hz), enemyAttack brute (2600 Hz), charger (3200 Hz) and spawnTelegraph (2350 Hz) — are all the same 'synth struck bowl', and the whole vocabulary fits inside 2100-3200 Hz, a span of 7.3 semitones. solo-levels.json confirms the ear cannot separate them: all six peak in the same 2400-4800 Hz band, and the six-band lift profiles are near-identical after removing loudness — enemyAttack/brute vs enemyAttack/charger 0.6 dB rms apart, enemyWindup/charger vs spawnTelegraph 1.8 dB, enemyWindup/brute vs enemyWindup/charger 2.0 dB. Only the caster wind-up separates at all (5.7 dB). Worse, the layer that actually says WHICH enemy is the quiet one: bell 1.20 vs swordMetal 0.30 (-12.0 dB) for the brute, 0.72 vs laserRetro 0.22 (-10.3 dB) for the caster, 1.07 vs creature 0.28 (-11.6 dB) for the charger. The identifying cue sits 10-12 dB under the generic cue, on all three. Result: with your back turned you hear 'something is about to hurt me' but never which of three enemies, and the three demand different responses.","stronger_does":"In ref-density-01 and -02 the threat channel is separated by carrier, not by an offset on one shared carrier. The yellow tracer line, the red laser sight, the orange fireball cluster, the pink hearts and the grey smoke each own a different hue AND a different shape AND a different motion, at full contrast. The identifying property is the loud property — you never have to look past a generic 'danger' element to find out which danger it is. Nothing in that frame is another thing shifted one semitone.","fix":"Give each enemy class its own timbre family and separate them by more than an octave, then invert the layer ratio. Concretely: keep the struck bowl for exactly one class, move the brute to a low struck/wood body around 300-500 Hz, and give the charger a rising pitch sweep (not a struck decay) so it is separated by envelope shape as well as by frequency; leave the caster's bright bell where it is. Then raise the identifying layer (swordMetal / laserRetro / creature) to within 3 dB of the shared layer, or above it, and drop the shared bell to a 'something' bed underneath. Re-run solo-levels.json and require the six-band shape distance between any two danger cues to be >= 8 dB rms before calling it done — that number is the gate, not the ear.","repro":null}],"latest":[],"history":[],"latestExhibit":null,"referenceExhibit":{"image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAACgKADAAQAAAABAAABaAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+IH6ElDQ19QUk9GSUxFAAEBAAAH2GFwcGwCIAAAbW50clJHQiBYWVogB9kAAgAZAAsAGgALYWNzcEFQUEwAAAAAYXBwbAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y1hcHBsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAALZGVzYwAAAQgAAABvZHNjbQAAAXgAAAWcY3BydAAABxQAAAA4d3RwdAAAB0wAAAAUclhZWgAAB2AAAAAUZ1hZWgAAB3QAAAAUYlhZWgAAB4gAAAAUclRSQwAAB5wAAAAOY2hhZAAAB6wAAAAsYlRSQwAAB5wAAAAOZ1RSQwAAB5wAAAAOZGVzYwAAAAAAAAAUR2VuZXJpYyBSR0IgUHJvZmlsZQAAAAAAAAAAAAAAFEdlbmVyaWMgUkdCIFByb2ZpbGUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA y surface is one flat 9x9 `seal` slab (r 4..12, c 9..17), axis-aligned and featureless. The eye has twelve competing focal points and none of them is the fight.\n3. The play surface is the brightest, flattest, emptiest region, and the player is a small dark figure on it with almost no contrast. The most important thing in the frame has the least.\n4. Four text elements compete: the WAVE 1 banner, the WAVE 1/1 counter, the control hint bar and THE THRESHOLD plate. Not yours to delete (hud.ts is the ui lane), but compose around them.\nThis piece was PARKED for eleven rounds because every round guessed. It re-enters now for one reason only: ART_DIRECTION.md exists. Cite it by section. Its section 5 acceptance table is your gate, not taste.","owns":["src/sim/arena.ts","src/render/tilemap.ts","src/render/light.ts","src/render/atmosphere.ts","tools/make-bardo-tiles.ts"],"protocol":"Still. Dev server must already be on :5173; never start a second. 1) `pnpm shot -- --scenario wave1 --seed 1 --ticks 30 --stepwise 1 --out <E>/still.png` -- the first room as the player meets it, same seed and tick every round. 2) the same frame at 4x NEAREST on the play surface as <E>/exhibit.png, the blind-comparison exhibit. 3) a busy frame, `--scenario wave3 --bot kite --ticks 500`, as <E>/busy.png: a room that reads empty must still read under seven enemies. 4) ART_DIRECTION.md section 5 measured into <E>/bible.json -- floor mean luminance (must be <= 0.30), highlight budget (fraction above 72% luminance, must be <= 8%), centre lift (centre 60% mean vs outer 20% ring, must be higher by >= 1 band), location of the top 1% of luminance (must be within 64 px of the focal object or a character), and mirror asymmetry (mean abs L difference against the frame's own mirror -- report it; near zero is the defect). NOTE src/sim/arena.ts is a SIM file: any change re-pins the replay hashes. Run `pnpm record-bots` and paste the printed hashes into tests/sim/replay.test.ts. Never hand-edit a hash. `src/render/presenter.ts` belongs to the feel lane this wave -- if you need it to change a constructor signature, stop and report.","reference":["gauntlet/evidence/reference/ref-room-01.jpg","gauntlet/evidence/reference/ref-room-02.jpg","gauntlet/evidence/reference/ref-density-01.jpg"],"status":"open","rounds":1,"stalls":0,"memo":[{"wave":1,"round":0,"element":"un-parked","stronger_does":"n/a","fix":"Parked after 11 rounds because no art direction existed and every round guessed. ART_DIRECTION.md now exists (533 lines, sections 0-11, with an acceptance table), so per bardo-critic section 7 the piece re-enters. It also has a measured brief and measurable gates, which the 11 rounds never had."},{"wave":2,"round":0,"element":"Enemy sprite lighting in busy.png: every enemy is DARKER than the floor it stands on. Measured Weber contrast against a 3x-radius local background ring: caster1 -0.34 (L 0.052 vs floor 0.079), charger5 -0.34 (0.156 vs 0.236), brute -0.55 (0.060 vs 0.133), caster2 -0.04. Body saturation 0.42-0.48. The brute is winding up (state 'windup', stateTick 8) directly on top of the player and is the least visible object in the frame.","stronger_does":"In ref-density-01 every ordinary threat is brighter than its floor by a Weber contrast of +1.43 to +2.17 (2.4x-3.2x local floor luminance) at body saturation 0.63-0.67, each with a hard dark keyline and a cast contact shadow. Where A does go darker than the floor, it is the boss at -0.17, and it pays for that with saturation 0.96 and a silhouette filling ~12% of the frame. A never asks you to find a low-saturation sub-floor-value sprite.","fix":"Light the actors above the room instead of under it. Give every enemy body an authored value floor tied to the local floor value (target body mid-tone >= 2x local floor L, i.e. >= 0.30 against our 0.15 floor) and lift body saturation into the 0.60-0.70 band A uses. Add a 1px warm rim on the key side plus a hard dark elliptical contact shadow at the feet so the silhouette survives even when the body value dips. Then split silhouette hue per archetype (brute / charger / caster) so the type reads from value and hue, not from a pink hat. Re-measure the same four Weber numbers and require all >= +1.0.","repro":null}],"latest":[],"history":[],"latestExhibit":null,"referenceExhibit":{"image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAACgKADAAQAAAABAAABaAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/8AAEQgBaAKAAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBRCkaGxwQkjM1LwFWJy0QoWJDThJfEXGBkaJicoKSo1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoKDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uLj5OXm5+jp6vLz9PX29/j5+v/bAEMAAgICAgICAwICAwUDAwMFBgUFBQUGCAYGBgYGCAoICAgICAgKCgoKCgoKCgwMDAwMDA4ODg4ODw8PDw8PDw8PD//bAEMBAgICBAQEBwQEBxALCQsQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEP/dAAQAKP/aAAwDAQACEQMRAD8A/n/ooooAKXBp8as5CIMsTgAdya9Ev/hZ4x03Rf7durVRAEV2QNmVQ395MZGO/pXNVxdOnKMJySctEu78j3so4YzDH06tbBUJVI0lzTcYtqK7u22zPOMGjBr2/QP2fviT4j8D33xDs7SKDR7JQQ1xJ5TzyMRthgUj95KynzFQHJQFugrzjw94R13xRqT6XpUGZogTJv8AlVMf3jjjnj61hHNcO1OSqK0d9dvU63wTm3taNH6rPmq6QXK7ydk9NNdGn6M5fBowa7+X4a+L4/Edt4WWyMt9eECLZlkYE4zuA6AkZ9K2Pid8G/G3wkvYbDxdFCJpEUyC3l837PIwyYZsAeXMvIZDyCCKv+0qHPGnzq8ldK+68hYrgvNqMKtSrhZxVJtTbi/date+mluZX9V3PKMH0owfSvSrL4WeMr3RF12C1UQOhkVGbEpUdCEx3HI9RzXReAvgN8Q/iLpuoazottDa2GmRvJPcXsv2eJQuQBuYEbnYbEH8T/KOazlm+FUHUdRWTs3fr2Ox+HWeqVOLwVS8488fcesdNVptdperS6nieD6UYPpWnqGn3mlXs2nahE0NxA210YYIP/1+1U674yUkmnofJ18NOlOVKqmpRdmno01un5ogwfSjB9Knoptm     var last = memo.length ? memo[memo.length - 1] : null;
    h.push('<article class="card" data-status="' + esc(st) + '">');
    h.push('<div class="head"><h3>' + esc(id) + '</h3><span class="pill ' + esc(st) + '">' + esc(st) + '</span></div>');
    if (p.spec) h.push('<div class="empty">' + esc(p.spec) + '</div>');
    h.push('<div class="rounds" title="one square per round">');
    hist.forEach(function (r) { h.push('<i class="' + esc(r.ruling) + '" title="w' + esc(r.wave) + 'r' + esc(r.round) + ' ' + esc(r.ruling) + '"></i>'); });
    h.push('</div>');
    var ex = function (label, e) {
      var out = '<div class="exhibit"><div class="eyebrow">' + label + '</div>';
      if (e && e.image) out += '<img alt="' + label + '" src="' + e.image + '">';
      else if (e && e.text) out += '<pre>' + esc(e.text) + '</pre>';
      else out += '<div class="none">nothing captured yet</div>';
      return out + '</div>';
    };
    h.push('<div class="exhibits">' + ex('Ours', p.latestExhibit) + ex('Reference', p.referenceExhibit) + '</div>');
    if (st === 'WIN') h.push('<div class="gapbox"><b>Blind critics could not tell which one shipped.</b></div>');
    else if (last) h.push('<div class="gapbox"><b>Biggest gap:</b> ' + esc(last.element) + ' <span class="fix">· the stronger one ' + esc(last.stronger_does) + ' · fix: ' + esc(last.fix) + '</span></div>');
    if (memo.length > 1) {
      h.push('<details><summary>' + (memo.length - 1) + ' earlier gap' + (memo.length > 2 ? 's' : '') + '</summary><ul>');
      memo.slice(0, -1).reverse().forEach(function (g) { h.push('<li>w' + esc(g.wave) + 'r' + esc(g.round) + ' · ' + esc(g.element) + ' → ' + esc(g.fix) + '</li>'); });
      h.push('</ul></details>');
    }
    h.push('</article>');
  });
  h.push('</div></section>');

  var waves = S.waves || [];
  h.push('<section class="log"><h2>Waves</h2>');
  if (!waves.length) h.push('<p class="empty">No wave has run yet.</p>');
  else {
    h.push('<div class="tablewrap"><table><thead><tr><th>Wave</th><th>Rounds</th><th>Wins</th><th>Smoothing</th><th>Note</th></tr></thead><tbody>');
    waves.forEach(function (w) {
      h.push('<tr><td class="mono">' + esc(w.n) + '</td><td class="mono">' + esc(w.rounds) + '</td><td class="mono">' + esc(w.wins) + '</td><td>' + esc(w.smoothing || '–') + '</td><td>' + esc(w.note || '') + '</td></tr>');
    });
    h.push('</tbody></table></div>');
  }
  h.push('</section>');
  app.innerHTML = h.join('');
})();
</script>
