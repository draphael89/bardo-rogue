appId: com.bardorogue.game
productName: Bardo Rogue
artifactName: 'Bardo-Rogue-${version}-mac-${arch}.${ext}'
forceCodeSigning: true
directories:
  output: release
  buildResources: build
# Only what the app actually needs at runtime. dist/ is what app://bardo serves, and it has already
# passed tools/check-build.ts by the time desktop:dist runs, so gauntlet evidence cannot reach a
# package. Source maps are excluded deliberately: they carry the whole of src/ and a player build has
# no use for them.
files:
  - package.json
  - desktop/out/**/*
  - dist/**/*
  - '!dist/**/*.map'
asar: true      # safe because the protocol handler reads with fs.promises.readFile, which is asar-aware
mac:
  category: public.app-category.games
  icon: build/icon.png
  # electron-builder chooses the Developer ID Application certificate type for this target; its
  # identity setting accepts the certificate's common name without the type prefix.
  identity: 'Infinity Growth Digital, Inc. (YF9662K2Y4)'
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]      # zip is the Steam- and updater-friendly artifact; dmg is what a tester double-clicks
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  darkModeSupport: true
  notarize: true
  extendInfo:
    NSHighResolutionCapable: true
dmg:
  contents:
    - { x: 130, y: 220 }
    - { x: 410, y: 220, type: link, path: /Applications }
