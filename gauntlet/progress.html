<title>Gauntlet Progress</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #F2F4F6; --surface: #FFFFFF; --line: #D9DEE4;
    --ink: #14181D; --muted: #5C6773; --accent: #1F5FBF;
    --win: #1E7F4F; --gap: #B7791F; --bad: #B03A2E; --pending: #6B7480;
    --win-bg: #E3F3EA; --gap-bg: #FBF0DA; --bad-bg: #F8E2DF; --pending-bg: #E9ECEF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0F1216; --surface: #171B21; --line: #2A313A;
      --ink: #E8ECF0; --muted: #8B96A3; --accent: #6FA3FF;
      --win: #5CCB8B; --gap: #E2B45B; --bad: #EE8A7C; --pending: #98A2AE;
      --win-bg: #15301F; --gap-bg: #3A2D12; --bad-bg: #3B1B17; --pending-bg: #222831;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0F1216; --surface: #171B21; --line: #2A313A;
    --ink: #E8ECF0; --muted: #8B96A3; --accent: #6FA3FF;
    --win: #5CCB8B; --gap: #E2B45B; --bad: #EE8A7C; --pending: #98A2AE;
    --win-bg: #15301F; --gap-bg: #3A2D12; --bad-bg: #3B1B17; --pending-bg: #222831;
  }
  body { background: var(--ground); color: var(--ink); font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif; margin: 0; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 20px; }
  h1, h2, h3 { font-family: "Archivo", "IBM Plex Sans", sans-serif; margin: 0; text-wrap: balance; }
  h1 { font-size: 22px; font-weight: 700; line-height: 1.2; }
  h2 { font-size: 15px; font-weight: 700; }
  h3 { font-size: 15px; font-weight: 700; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  header { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .bar { color: var(--muted); }
  .bar b { color: var(--ink); font-weight: 600; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--muted); }
  .stats span b { color: var(--ink); font-weight: 500; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 720px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .pill { font-size: 11px; font-weight: 600; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .pill.WIN { color: var(--win); background: var(--win-bg); }
  .pill.OPEN, .pill.GAP { color: var(--gap); background: var(--gap-bg); }
  .pill.PARKED, .pill.BUDGET, .pill.STALL { color: var(--bad); background: var(--bad-bg); }
  .pill.DRY, .pill.PENDING, .pill.ERROR { color: var(--pending); background: var(--pending-bg); }
  .rounds { display: flex; gap: 4px; flex-wrap: wrap; }
  .rounds i { width: 14px; height: 14px; border-radius: 3px; background: var(--pending-bg); display: inline-block; }
  .rounds i.WIN { background: var(--win); } .rounds i.GAP { background: var(--gap); } .rounds i.STALL, .rounds i.ERROR { background: var(--bad); }
  .exhibits { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .exhibit { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .exhibit img { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 4px; background: var(--ground); }
  .exhibit pre { margin: 0; font-size: 12px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 4px; padding: 8px; background: var(--ground); }
  .exhibit .none { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; padding: 12px; text-align: center; }
  .gapbox { font-size: 14px; }
  .gapbox b { font-weight: 600; }
  .gapbox .fix { color: var(--muted); }
  details { font-size: 13px; }
  summary { cursor: pointer; color: var(--accent); font-weight: 500; }
  details ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .log { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .log table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .log th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); }
  .log td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .log tr:last-child td { border-bottom: 0; }
  .tablewrap { overflow-x: auto; }
  .empty { color: var(--muted); font-size: 14px; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

window.GAUNTLET_STATE = {"goal":"Finish Bardo Rogue, a browser action-roguelike, so a blind critic cannot pick it out beside real Enter the Gungeon and Hades frames.","bar":"Enter the Gungeon and Hades","arena":"game","mix":"efficient","stopRule":"until the user stops it","wave":2,"status":"running","evidenceLimit":"Reference exhibits are 1920x1080 gameplay stills. Motion timing is judged against the rubric's feel-chain acceptance criteria using our own tick-labelled strips, not against the bar. Every motion verdict must say so.","phase0":"Repair batch run before wave 1: attack edge-trigger, camera-aware pointer, live metrics getter, widened state hash, visual/gameplay RNG stream split, pool-overflow telemetry, restart replay parity, tools/strip.ts motion exporter, ART_DIRECTION.md, per-entity views split, recalibrated balance gates.","lanes":[{"id":"feel","why":"sword, dodge and impact all read and write player.ts, combat.ts, tuning.ts, presenter.ts and camera.ts. One owner, in sequence.","pieces":["sword-swing","hit-impact","dodge-roll"]},{"id":"brute","why":"own sim file plus its own view module after the views split; disjoint from every other lane.","pieces":["brute"]},{"id":"caster","why":"own sim file plus its own view module; disjoint.","pieces":["caster"]},{"id":"charger","why":"own sim file plus its own view module; disjoint.","pieces":["charger"]},{"id":"ui","why":"hud.ts and damageNumbers.ts are touched by nothing else this wave; two pieces share hud.ts so they run in sequence.","pieces":["combat-hud","death-card"]},{"id":"audio","why":"src/audio is fully disjoint from every other lane.","pieces":["audio-bed"]}],"pieces":{"sword-swing":{"spec":"The three-hit greatsword chain: anticipation, arc, contact, recovery, and a heavy third hit that reads as a commitment. Verified leads, do not spend a round rediscovering them: the heavy is only +4 startup ticks, +2 hit-stop, +60 degrees of arc and double damage — nothing in the world commits to it, so it reads as a big light hit rather than a greatsword. Movement is zeroed for 10 ticks during heavy startup (167 ms) and is barely perceived. The crescent arc with tapered trailing edge is already the best visual in the game; build on it, do not replace it. Consider hit-confirm recovery (connecting cancels earlier than missing), whiff commitment, aim steering during early startup only, and an authored lunge curve instead of the current uniform one. Responsive does not mean uncommitted: do not make all four phases equally cancellable.","owns":["src/sim/player.ts","src/sim/combat.ts","src/tuning.ts","src/render/views/player.ts","src/render/presenter.ts","src/render/particles.ts","src/render/camera.ts"],"protocol":"Motion. Dev server must already be on :5173; never start a second. 1) `pnpm strip -- --scenario dummy --seed 1 --from the first attack press --frames 12 --every 2 --crop 176,88,128,96 --out <E>/strip.png` — tick-labelled, --stepwise discipline, NEAREST upscale only. 2) the sidecar `<E>/strip.png.json` state+event trace. 3) `pnpm poses -- --only swing --out <E>/poses.png`. 4) the single most load-bearing frame, 4x NEAREST crop, as `<E>/exhibit.png` — this is the blind-comparison exhibit and it must be the same medium as the reference. 5) startup/active/recovery tick counts read from the trace, written to `<E>/timing.json`. Same seed, same crop box, every round. DRIVE THE INPUT WITH DISCRETE PRESSES, never `--hold '{\"attack\":true}'`: the hold flag re-applies the input partial before every single step, which is mashing at 60 Hz and hides what a player's own timing produces. Attack is now a true edge (one press = one intention), so use the `--eval` hook to press once per swing at the earliest legal chain tick. A chain captured by per-tick re-pressing is a fiction.","reference":["gauntlet/evidence/reference/ref-melee-01.jpg","gauntlet/evidence/reference/ref-melee-02.jpg","gauntlet/evidence/reference/ref-melee-03.jpg"],"status":"open","rounds":1,"stalls":0,"memo":[{"wave":1, s: the camera is SILENT on light hits, which are ~90 percent of all swings. Shake is trauma squared times shakeMax, so traumaLight 0.22 yields 0.22^2 x 4px = 0.19 internal pixels — invisible at 480x270 — and the directional kick is gated on `ev.heavy || ev.killed` (presenter.ts:80) so light hits get none at all. Separately, TWO reward channels are dead code: `dodged` (a successful i-frame dodge-through, the most skill-expressive input in the game) and `enemyStagger` are both emitted by the sim and consumed ONLY by metrics — grep confirms zero presenter and zero audio consumers. The game says nothing when the player does the hardest thing in it. The kill shatter, blood decals that outlive the fight, and the poise rule (only the heavy staggers a brute) already work; keep them.","owns":["src/sim/combat.ts","src/tuning.ts","src/render/presenter.ts","src/render/particles.ts","src/render/camera.ts","src/render/views/player.ts"],"protocol":"Motion. Dev server must already be on :5173; never start a second. 1) `pnpm strip -- --scenario wave1 --seed 1 --from 2 ticks before first contact --frames 12 --every 2 --crop 160,80,160,110 --out <E>/strip.png` — tick-labelled, --stepwise discipline, NEAREST upscale only. 2) the sidecar `<E>/strip.png.json` state+event trace. 3) `pnpm poses -- --only kill --out <E>/poses.png`. 4) the single most load-bearing frame, 4x NEAREST crop, as `<E>/exhibit.png` — this is the blind-comparison exhibit and it must be the same medium as the reference. 5) startup/active/recovery tick counts read from the trace, written to `<E>/timing.json`. Same seed, same crop box, every round. Additionally capture an idle strip with the SAME crop as `<E>/strip-idle.png`: a light-hit strip that is indistinguishable from idle is an automatic loss. DRIVE THE INPUT WITH DISCRETE PRESSES, never `--hold '{\"attack\":true}'`: the hold flag re-applies the input partial before every single step, which is mashing at 60 Hz and hides what a player's own timing produces. Attack is now a true edge (one press = one intention), so use the `--eval` hook to press once per swing at the earliest legal chain tick. A chain captured by per-tick re-pressing is a fiction.","reference":["gauntlet/evidence/reference/ref-melee-01.jpg","gauntlet/evidence/reference/ref-melee-02.jpg","gauntlet/evidence/reference/ref-melee-03.jpg"],"status":"open","rounds":2,"stalls":0,"memo":[{"wave":1,"round":2,"element":"wave-1 verdicts lost","stronger_does":"n/a - infrastructure, not a gap","fix":"Re-enter at wave 2 round 1. The critic verdicts lived only in the Workflow return and died with the process, and repair R1 then changed the global colour grade (p99 178 -> 229), so every wave-1 capture is non-comparable to anything captured from now on. Wave 2 round 1 is the new baseline for this piece."}],"latest":[],"history":[],"latestExhibit":null,"referenceExhibit":{"image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAYQBhAAD/4QCARXhpZgAATU0AKgAAAAgABAEaAAUAAAABAAAAPgEbAAUAAAABAAAARgEoAAMAAAABAAIAAIdpAAQAAAABAAAATgAAAAAAEYdtAAAufgARh20AAC5+AAOgAQADAAAAAQABAACgAgAEAAAAAQAAAoCgAwAEAAAAAQAAAWgAAAAA/+0AOFBob3Rvc2hvcCAzLjAAOEJJTQQEAAAAAAAAOEJJTQQlAAAAAAAQ1B2M2Y8AsgTpgAmY7PhCfv/AABEIAWgCgAMBIgACEQEDEQH/xAAfAAABBQEBAQEBAQAAAAAAAAAAAQIDBAUGBwgJCgv/xAC1EAACAQMDAgQDBQUEBAAAAX0BAgMABBEFEiExQQYTUWEHInEUMoGRoQgjQrHBFVLR8CQzYnKCCQoWFxgZGiUmJygpKjQ1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4eLj5OXm5+jp6vHy8/T19vf4+fr/xAAfAQADAQEBAQEBAQEBAAAAAAAAAQIDBAUGBwgJCgv/xAC1EQACAQIEBAMEBwUEBAABAncAAQIDEQQFITEGEkFRB2FxEyIygQgUQpGhscEJIzNS8BVictEKFiQ04SXxFxgZGiYnKCkqNTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqCg4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2dri4+Tl5ufo6ery8/T19vf4+fr/2wBDAAICAgICAgMCAgMFAwMDBQYFBQUFBggGBgYGBggKCAgICAgICgoKCgoKCgoMDAwMDAwODg4ODg8PDw8PDw8PDw//2wBDAQICAgQEBAcEBAcQCwkLEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBD/3QAEACj/2gAMAwEAAhEDEQA/APwByR E PRESSES, never `--hold '{\"attack\":true}'`: the hold flag re-applies the input partial before every single step, which is mashing at 60 Hz and hides what a player's own timing produces. Attack is now a true edge (one press = one intention), so use the `--eval` hook to press once per swing at the earliest legal chain tick. A chain captured by per-tick re-pressing is a fiction.","reference":["gauntlet/evidence/reference/ref-melee-01.jpg","gauntlet/evidence/reference/ref-melee-02.jpg","gauntlet/evidence/reference/ref-melee-03.jpg"],"status":"open","rounds":0,"stalls":0,"memo":[{"wave":1,"round":0,"element":"wave-1 verdicts lost","stronger_does":"n/a - infrastructure, not a gap","fix":"Re-enter at wave 2 round 1. The critic verdicts lived only in the Workflow return and died with the process, and repair R1 then changed the global colour grade (p99 178 -> 229), so every wave-1 capture is non-comparable to anything captured from now on. Wave 2 round 1 is the new baseline for this piece."}],"latest":[],"history":[],"latestExhibit":null,"referenceExhibit":{"image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAYQBhAAD/4QCARXhpZgAATU0AKgAAAAgABAEaAAUAAAABAAAAPgEbAAUAAAABAAAARgEoAAMAAAABAAIAAIdpAAQAAAABAAAATgAAAAAAEYdtAAAufgARh20AAC5+AAOgAQADAAAAAQABAACgAgAEAAAAAQAAAoCgAwAEAAAAAQAAAWgAAAAA/+0AOFBob3Rvc2hvcCAzLjAAOEJJTQQEAAAAAAAAOEJJTQQlAAAAAAAQ1B2M2Y8AsgTpgAmY7PhCfv/AABEIAWgCgAMBIgACEQEDEQH/xAAfAAABBQEBAQEBAQAAAAAAAAAAAQIDBAUGBwgJCgv/xAC1EAACAQMDAgQDBQUEBAAAAX0BAgMABBEFEiExQQYTUWEHInEUMoGRoQgjQrHBFVLR8CQzYnKCCQoWFxgZGiUmJygpKjQ1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4eLj5OXm5+jp6vHy8/T19vf4+fr/xAAfAQADAQEBAQEBAQEBAAAAAAAAAQIDBAUGBwgJCgv/xAC1EQACAQIEBAMEBwUEBAABAncAAQIDEQQFITEGEkFRB2FxEyIygQgUQpGhscEJIzNS8BVictEKFiQ04SXxFxgZGiYnKCkqNTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqCg4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2dri4+Tl5ufo6ery8/T19vf4+fr/2wBDAAICAgICAgMCAgMF ec":"The death moment and its card. The staging already works — 30 ticks of 0.25 slow-motion, the player's own sprite shatters, a red vignette closes in — and several audits called it the most art-directed moment in the game. What is wrong is the words. The card says 'YOU DIED' and 'press R', which is developer UX wearing a game's clothes, and the loudest authored voice in the entire build is a stock fighter-game announcer shouting FLAWLESS VICTORY over an indigo death-realm. Read VISION.md: you are already dead, losing a run is being pulled back to the bardo, not a game over. This is the cheapest place in the whole project to put the fiction into the game instead of the filename, and there is a latent motif nobody wrote down — a room floating in a starfield void, doors and windows opening onto star-sky, THE THRESHOLD. Also add the run summary that is missing. `ART_DIRECTION.md` at the repo root is the aim; cite it.","owns":["src/render/hud.ts","src/render/atmosphere.ts"],"protocol":"Still plus short motion. `pnpm strip -- --scenario wave1 --seed 5 --from <the killing blow> --frames 10 --every 3 --out <E>/strip.png` for the death sequence, plus the settled card as `<E>/exhibit.png` at 2x NEAREST. Same seed and start tick every round.","reference":["gauntlet/evidence/reference/ref-ui-01.jpg","gauntlet/evidence/reference/ref-ui-02.jpg"],"status":"open","rounds":0,"stalls":0,"memo":[{"wave":1,"round":0,"element":"wave-1 verdicts lost","stronger_does":"n/a - infrastructure, not a gap","fix":"Re-enter at wave 2 round 1. The critic verdicts lived only in the Workflow return and died with the process, and repair R1 then changed the global colour grade (p99 178 -> 229), so every wave-1 capture is non-comparable to anything captured from now on. Wave 2 round 1 is the new baseline for this piece."}],"latest":[],"history":[],"latestExhibit":null,"referenceExhibit":{"image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAYQBhAAD/4QCARXhpZgAATU0AKgAAAAgABAEaAAUAAAABAAAAPgEbAAUAAAABA   if (!waves.length) h.push('<p class="empty">No wave has run yet.</p>');
  else {
    h.push('<div class="tablewrap"><table><thead><tr><th>Wave</th><th>Rounds</th><th>Wins</th><th>Smoothing</th><th>Note</th></tr></thead><tbody>');
    waves.forEach(function (w) {
      h.push('<tr><td class="mono">' + esc(w.n) + '</td><td class="mono">' + esc(w.rounds) + '</td><td class="mono">' + esc(w.wins) + '</td><td>' + esc(w.smoothing || '–') + '</td><td>' + esc(w.note || '') + '</td></tr>');
    });
    h.push('</tbody></table></div>');
  }
  h.push('</section>');
  app.innerHTML = h.join('');
})();
</script>
